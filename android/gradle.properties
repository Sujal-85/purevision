# Optimized for low-memory environment (less than 8GB physical RAM)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Save memory by not spawning a separate Kotlin daemon
kotlin.compiler.execution.strategy=in-process
